note: >-
  Google does not run a single-page trust centre for Vault. Trust material is split across the
  Google Workspace security page (product-level controls and named regimes), Google Cloud's
  compliance offerings directory (per-standard certificates), the Compliance Reports Manager
  (where a customer downloads the actual audit reports), and safety.google (consumer-facing
  privacy). Every URL below returned HTTP 200 on 2026-09-12. Vault itself is an eDiscovery and
  legal-hold product, so it is usually the thing a customer buys IN ORDER TO comply — the
  compliance posture recorded here is Google Workspace's, which is the service boundary the
  Vault API runs inside.
