specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Google Vault
providerId: google-vault
generated: '2026-09-12'
method: searched
source: >-
  https://developers.google.com/workspace/vault/limits and
  https://knowledge.workspace.google.com/vault/getting-started/vault-overview
created: '2026-05-04'
modified: '2026-09-12'
tags: []
description: >-
  The Vault API is not separately priced and has no tiers of its own. Google states plainly
  that "the Google Vault API is available at no additional cost to Google Workspace
  customers" — what you buy is a Workspace edition (or a Vault add-on license), and the API
  comes with it at the same quota for everyone. There is no free tier, no metered usage, no
  overage and no per-call price.
note: >-
  Replaces the 2026-05-04 scaffold, which invented a "free" tier with a 1,000-request monthly
  quota and a 10 rpm rate limit. None of that exists. The entitlement tiers below are Google's
  own edition list, and the quota attached to every one of them is the same published
  per-minute quota recorded in rate-limits/google-vault-rate-limits.yml.
pricing_model: included-with-subscription
api_priced_separately: false
metered: false
free_tier: false
plan_count: 0
plan_count_note: >-
  Zero API plans, deliberately. The API has no plan surface at all; the rows below are product
  ENTITLEMENTS — which Workspace editions include Vault — not API pricing tiers, and they are
  recorded separately so nothing here is mistaken for a per-call price list.
entitlements:
  - edition: Frontline Standard
    vault_included: true
  - edition: Frontline Plus
    vault_included: true
  - edition: Business Plus
    vault_included: true
  - edition: Enterprise Standard
    vault_included: true
  - edition: Enterprise Plus
    vault_included: true
  - edition: Education editions (all)
    vault_included: true
  - edition: Enterprise Essentials
    vault_included: true
    caveat: Domain-verified accounts only.
  - edition: Enterprise Essentials Plus
    vault_included: true
    caveat: Domain-verified accounts only.
  - edition: G Suite Business (legacy)
    vault_included: true
  - edition: Other Workspace editions
    vault_included: false
    note: Vault add-on licenses are available for purchase, or the customer upgrades edition.
entitlement_notes:
  - >-
    "If Vault is included with your edition, all users and admins in your organization are
    automatically assigned a Vault license."
  - >-
    From 1 November 2025 a Google Workspace admin must hold a Vault license to continue using
    Vault.
  - >-
    Add-on license pricing is not published on a public page; it is quoted through Google
    Workspace sales or a reseller.
pricing_pages:
  - kind: workspace-editions
    url: https://workspace.google.com/pricing.html
    note: Prices the Workspace editions, not Vault or the Vault API.
  - kind: vault-entitlement
    url: https://knowledge.workspace.google.com/vault/getting-started/vault-overview
quota_reference: rate-limits/google-vault-rate-limits.yml
