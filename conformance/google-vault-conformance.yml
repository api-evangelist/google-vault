domain_standards:
  - id: edrm-ediscovery-reference-model
    conforms: partial
    market: eDiscovery / legal hold / information governance
    evidence: >-
      Vault's own resource model is the EDRM vocabulary rendered as an API — Matter, Hold,
      HeldAccount, SavedQuery, Export with an ExportOptions/cloudStorageSink delivery, which
      maps to EDRM's Identification, Preservation, Collection and Production stages. This is a
      vocabulary alignment observed in the contract's schema names, not a declared conformance:
      Google states no EDRM conformance claim anywhere in the docs or the Discovery document,
      and there is no EDRM certification to hold.
    caveat: >-
      Recorded as partial and evidence-backed rather than true. EDRM is a reference model, not
      a wire format, so no contract can conform to it in the sense this file uses elsewhere.
  - id: edrm-load-file-formats
    conforms: unknown
    evidence: >-
      Export output format is chosen through ExportOptions (mbox/PST for mail, and the
      documented export formats for Drive and Chat). The Discovery document names the options
      but the produced load files are described in the Vault help centre rather than in the
      API contract, so no conformance claim is made here.
