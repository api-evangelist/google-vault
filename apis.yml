aid: google-vault
name: Google Vault
description: >-
  Google Vault is the information-governance, legal-hold and eDiscovery service for Google
  Workspace. Its REST API (vault.googleapis.com v1) lets an administrator open matters, place
  and lift legal holds across Gmail, Drive, Groups, Chat, Voice, Calendar and Gemini, save and
  count search queries, and export matching data to Google Cloud Storage. Access is OAuth 2.0
  only, gated on Workspace Vault privileges, and the contract is published as a Google
  Discovery document rather than an OpenAPI.
tags:
  - eDiscovery
  - Legal Hold
  - Information Governance
  - Compliance
  - Archiving
  - Retention
  - Google Workspace
  - Audit
