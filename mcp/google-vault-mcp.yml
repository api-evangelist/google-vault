generated: '2026-09-12'
method: derived
status: candidate
source: >-
  discovery/google-vault-discovery-v1.json and openapi/*.yml — derived. Google publishes NO
  MCP server for Vault.
note: >-
  Google does ship first-party remote MCP servers for Google Workspace, and Vault is not one
  of them. The provider's own configuration page
  (https://developers.google.com/workspace/guides/configure-mcp-servers) enumerates exactly
  eight product endpoints — Gmail, Drive, Docs, Sheets, Slides, Calendar, Chat and People —
  all shaped <product>mcp.googleapis.com/mcp/v1. On 2026-09-12 a tools/list POST to the
  host that would follow that naming pattern for Vault returned HTTP 404, while the same
  request to the documented gmailmcp.googleapis.com/mcp/v1 endpoint returned HTTP 200 with a
  real tool list — a controlled negative, not a network failure. The tools below are a
  CANDIDATE surface derived from the 33 methods in Google's own Discovery document. Nobody
  ships them. No endpoint is invented here and no MCPServer pointer is wired in apis.yml.
deployment:
  mode: none
  endpoint: null
  install: null
  package: null
  auth: oauth
  verified: probed
  probe:
    documented_endpoint_list: https://developers.google.com/workspace/guides/configure-mcp-servers
    vault_listed: false
    negative_probe:
      url: https://vaultmcp.googleapis.com/mcp/v1
      method: POST
      body: '{"jsonrpc":"2.0","id":1,"method":"tools/list"}'
      http_status: 404
      note: >-
        Probed only to confirm the absence implied by Google's own list. It is NOT a published
        endpoint and must never be recorded as one.
    control:
      url: https://gmailmcp.googleapis.com/mcp/v1
      http_status: 200
      note: Documented Google endpoint; returned a real tools/list payload, so the probe path works.
authorization:
  model: OAuth 2.0 with Google Workspace Vault privileges
  scopes:
    - https://www.googleapis.com/auth/ediscovery
    - https://www.googleapis.com/auth/ediscovery.readonly
candidate_tools:
  - name: list_matters
