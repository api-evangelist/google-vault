    rest_method: vault.matters.list
    source_operation: openapi/google-vault-matters-api-openapi.yml#matters.list
    read_only: true
    scope: https://www.googleapis.com/auth/ediscovery.readonly
  - name: get_matter
    description: Read one matter by id, in BASIC or FULL view.
    rest_method: vault.matters.get
    read_only: true
    scope: https://www.googleapis.com/auth/ediscovery.readonly
  - name: create_matter
    description: Create a new eDiscovery matter.
    rest_method: vault.matters.create
    read_only: false
    scope: https://www.googleapis.com/auth/ediscovery
  - name: close_matter
    description: Close a matter. Reversible with reopen_matter.
    rest_method: vault.matters.close
    read_only: false
  - name: reopen_matter
    description: Reopen a closed matter.
    rest_method: vault.matters.reopen
    read_only: false
  - name: delete_matter
    description: >-
      Delete a closed matter. Soft delete — restorable with undelete_matter for approximately
      30 days, then permanently purged.
    rest_method: vault.matters.delete
    read_only: false
    destructive: true
  - name: undelete_matter
    description: Restore a matter deleted within the last ~30 days.
    rest_method: vault.matters.undelete
    read_only: false
  - name: count_matter_artifacts
    description: >-
      Count the artifacts a search query would return, as a long-running operation. The safest
      rehearsal available before creating an export.
    rest_method: vault.matters.count
    read_only: false
    scope: https://www.googleapis.com/auth/ediscovery
    note: Read-shaped but gated behind the full ediscovery scope by the provider.
  - name: list_holds
    description: List the legal holds on a matter.
    rest_method: vault.matters.holds.list
    read_only: true
  - name: create_hold
    description: Place a legal hold on accounts or an org unit for a corpus.
    rest_method: vault.matters.holds.create
    read_only: false
  - name: delete_hold
    description: >-
      Remove a legal hold. IRREVERSIBLE — no restore method exists, and data the hold was
      preserving becomes subject to normal retention again.
    rest_method: vault.matters.holds.delete
    read_only: false
    destructive: true
  - name: add_held_accounts
    description: Add accounts to an existing hold.
    rest_method: vault.matters.holds.addHeldAccounts
    read_only: false
  - name: remove_held_accounts
    description: Remove accounts from a hold.
    rest_method: vault.matters.holds.removeHeldAccounts
    read_only: false
  - name: list_saved_queries
    description: List the saved search queries on a matter.
    rest_method: vault.matters.savedQueries.list
    read_only: true
  - name: create_export
    description: >-
      Start an export of matching data. Consumes one of the 20 organization-wide concurrent
      export slots; poll get_export until status leaves IN_PROGRESS.
    rest_method: vault.matters.exports.create
    read_only: false
  - name: get_export
    description: Read an export's status and stats.
    rest_method: vault.matters.exports.get
    read_only: true
  - name: get_operation
