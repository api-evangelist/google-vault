note: >-
  This is the complete published changelog, not a recent window. Google's Vault API release
  notes page carries exactly three dated entries and the newest is from June 2020. The API
  itself is not frozen — the Discovery document was regenerated on 2026-09-05 — so the gap is
  in the announcement channel rather than the contract. Anyone depending on release notes to
  detect Vault API change is watching a channel that has not moved in six years.
