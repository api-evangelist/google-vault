  - date: '2020-06-01'
    kind: deprecation
    breaking: true
    highlight: All Team Drive-related fields are removed from the Vault API.
  - date: '2019-06-10'
    kind: change
    breaking: true
    highlight: >-
      "Team Drive" is renamed "shared drive"; corresponding API fields updated in DriveOptions,
      HeldDriveQuery and SearchMethod.
  - date: '2019-03-16'
    kind: announcement
    breaking: false
    highlight: >-
      Hangouts Chat and Google Meet replace classic Hangouts; Vault admins are told to prepare
      for the migration of covered data.
